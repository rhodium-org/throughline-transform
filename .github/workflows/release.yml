name: release

# Publishes throughline-transform to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored as a secret. Before
# the first release, register this repository + workflow as a trusted publisher for
# the `throughline-transform` project on PyPI
# (https://pypi.org/manage/account/publishing/) and create a GitHub Environment named
# `pypi`. Until then this workflow is dormant (it only runs on a published Release).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The shipped suite, run from the shipped artifact, BEFORE anything is uploaded
  # (SR-0041). A check that runs after the upload names a defect the reader can no
  # longer avoid, so publication waits on this rather than reporting beside it.
  sdist-suite:
    uses: ./.github/workflows/sdist-suite.yml

  build:
    name: Build sdist + wheel
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The tag names the version pyproject.toml declares
        # A release is the package version: a tag with another number would publish a
        # package nobody can find under the name the release bears, as v3.18.1 did on
        # 2026-10-15, publishing 3.18.0. The build stops here instead.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag v$tag does not match the version pyproject.toml declares, $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build, sdist-suite]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: pypi
      url: https://pypi.org/p/throughline-transform
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
