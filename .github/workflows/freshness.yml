name: freshness

# throughline and throughline-compose are declared as floors, not locked, so CI
# resolves whatever PyPI happens to publish. A green check is therefore only true
# on the day it ran: a release of either can turn this repo red without a commit
# here. This package reads the shape of what the tool writes (SR-0003), which is
# exactly the kind of dependency a release can move, so the ceiling job is the
# one that says so before a contributor meets it.

on:
  schedule:
    # 03:23 UTC daily — outside UK working hours under both GMT and BST, offset
    # from the hour because scheduled jobs queue heavily on the hour.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ceiling:
    name: latest published dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install, resolving dependencies fresh
        run: pip install -e ".[dev]"

      - name: Record what was resolved
        run: pip list

      - name: Unit tests
        run: pytest -q

      - name: Self-host gate
        run: tl-compose -C idd check --strict --quiet

  floor:
    name: declared minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install at the declared floor
        # Read the floors out of pyproject rather than restating them here, so
        # this cannot drift from the versions the package actually promises.
        run: |
          pins=$(python -c "
          import tomllib
          deps = tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']
          print(' '.join(d.replace('>=','==') for d in deps))
          ")
          echo "installing floor: $pins"
          pip install $pins
          pip install -e . --no-deps
          pip install pytest

      - name: Record what was resolved
        run: pip list

      - name: Unit tests
        run: pytest -q

      - name: Self-host gate
        run: tl-compose -C idd check --strict --quiet
