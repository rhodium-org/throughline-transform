uid: SR-0016
type: system_requirement
status: implemented
title: --only narrows every form to the items it names
text: --only takes item identifiers separated by commas and may be given more than
  once. For md, docx, html and blocks, each directive's expression is joined with
  uid in [the identifiers], so tl docs writes only those items. The tabular outputs
  keep only their rows, and the links table only links with both ends kept. The notes
  output writes only their notes, and an identifier left out stays plain text, not
  a wikilink. The provenance lines add the items held, n of N. An identifier the
  graph does not hold is a usage error, exit 2, naming it, and nothing is written.
rationale: 'Identifiers rather than a filter expression, because the caller''s own
  filter — the table''s free-text search, a hand-picked set — is often not a tl expression,
  while the items it leaves are always a list of identifiers. Joining the directives''
  own expressions keeps every word of an item tl docs''s (NG-0001), and uid in [...]
  is the filter language throughline already has (tl:SR-0045). An unknown identifier
  is refused rather than skipped: a document silently missing an item that was asked
  for is the failure this option exists to prevent.'
normative: true
