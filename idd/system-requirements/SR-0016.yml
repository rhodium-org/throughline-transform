attrs:
  origin: ai
  priority: should
  verification: Over the fixture with --only naming two items, the Markdown holds
    exactly those two catalogue blocks and each matrix only their rows; the csv and
    xlsx hold two item rows and only the links between them; the notes hold two notes
    and no wikilink naming a third; the provenance says 2 of the fixture's count.
    --only naming an identifier the fixture lacks exits 2, names it, and writes no
    file.
