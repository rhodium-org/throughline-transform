uid: SR-0009
type: system_requirement
status: implemented
title: A notes output is one note per item, cut from the catalogue, with wikilinks
text: The catalogue and the mirrored clauses are written once and cut at the item
  line into one Markdown note per item, in a folder per register named by the register's
  title; cited clauses go under sources, one folder per namespace, with the colon
  of the identifier replaced by a space in the file name. Each note opens with YAML
  front matter holding type, status, normative flag and attributes as properties,
  the title as an alias, and a tag for the type and one for the status. The body
  is the tool's block reshaped for a note. The item line becomes a level-one heading
  of the identifier and title, with the type and status on the line beneath. The
  words, the rationale and the outgoing link lines follow as the tool wrote them.
  Then one line per incoming link type lists the items that link to this one, worded
  as the link type reads with the word this — Implements this, Derives from this
  — so a reader sees what rests on the item without opening a pane. The attribute
  line is left out, because the front matter already carries every attribute. Every
  identifier that names a note becomes a wikilink; a clause link shows the identifier
  the tool wrote as its text. A bracket pair the tool wrote in prose is escaped.
  An About note carries the provenance.
rationale: The same folder shape the editor produced, so a vault from either opens
  the same way. The colon is replaced because a note tool refuses one in a name and
  links by basename across the whole vault. Brackets in prose are escaped because
  an item that says declare it in [[sources]] would otherwise draw a ghost note.
  Two decisions were reversed on first real use in Obsidian. The incoming links had
  been left to the note tool's backlinks pane; a reader of a requirement wants what
  rests on it in the note itself, and the pane is closed by default and names no
  link type. The item line and the attribute line had been kept as the tool wrote
  them; a bold line is not how a note tool shows a title, and the attributes were
  already the note's properties, so the heading is the note's and the attribute line
  goes.
normative: true
links:
- target: UR-0002
  type: implements
attrs:
  origin: ai
  priority: should
  verification: For the fixtures, one note per item under its register's folder;
    each note opens with a level-one heading of its identifier and title and a line
    with its type and status; front matter parses as YAML with the item's properties
    and no attribute line follows the body; an item that something implements carries
    an Implements this line naming it as a wikilink; every wikilink names a note
    in the folder; the TOML brackets are escaped; a clause note is named with a space
    where the colon was.
