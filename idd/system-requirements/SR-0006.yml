uid: SR-0006
type: system_requirement
status: implemented
title: A links table names both ends of every link by the sheet each is on
text: 'Beside the item tables, one table holds one row per link: the sheet and uid
  it starts from, the link type, and the sheet and uid it points at. A link into
  an adopted source names the namespace as the sheet. The rows are in item order.'
rationale: A reviewer follows what rests on what. A links table can be sorted and
  filtered by either end; a link listed in a cell cannot.
normative: true
