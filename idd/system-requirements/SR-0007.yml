uid: SR-0007
type: system_requirement
status: implemented
title: Cited clauses travel with the export, and the workbook is read-only
text: The clauses of adopted sources that some item links to travel as one table
  per source, with the columns those clauses carry. The workbook opens read-only
  by recommendation with its structure locked and no password, and every sheet still
  sorts and filters. The csv archive says it cannot be protected.
rationale: An export is a record handed to people who did not make it. A copy edited
  on its way round is no longer a record of anything. csv has no protection, so the
  archive says so rather than leaving a reader to assume.
normative: true
links:
