uid: SR-0002
type: system_requirement
status: implemented
title: The Markdown is asked of tl docs over a document of directives
text: The Markdown output is a document of tl directives — a summary, a table of
  items, one traceability matrix per grounding link type, a catalogue of every item,
  and the mirrored clauses of adopted sources when the graph composes — handed to
  the docs command, written outside the graph, and read back. The region markers
  are stripped unless asked to stay.
rationale: The alternative is rendering items here, which NG-0001 refuses. Written
  outside the graph so an output can never be mistaken for a change to it.
normative: true
