uid: UR-0008
type: user_requirement
status: deleted
title: A graph is handed to an assistant that reads only a few files and cannot run
  tl
text: A user shall be able to produce, with one command, a form of the graph that
  an assistant reading a capped number of files can read whole, and that tells the
  assistant how to send changes back.
rationale: 'Raised by controlled environments where users are restricted to using
  Microsoft 365 Copilot: at most 50 files, no tl, text out only. Graphs there hold
  hundreds of item files but fewer than 50 registers. A form of output, so it lives
  here beside the other six and reaches the browser through the same package (INT-0002).
  Applying what comes back is throughline''s (tl:SR-0252).'
normative: true
links:
