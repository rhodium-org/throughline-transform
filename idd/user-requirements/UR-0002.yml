uid: UR-0002
type: user_requirement
status: ratified
title: The same six forms the editor offers
text: 'Markdown, a folder of notes for a note-taking tool such as Obsidian, CSV,
  an Excel workbook, a Word document, and a print-ready HTML document. Each holds
  what the editor''s export of the same graph holds: the same items, links, attributes
  and cited clauses, laid out the same way.'
rationale: A reader who was handed a workbook from the editor last week and a workbook
  from this tool today should not be able to tell which made it. Two shapes for one
  graph would be two things to explain.
normative: true
