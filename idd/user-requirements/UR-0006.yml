uid: UR-0006
type: user_requirement
status: proposed
title: The tool runs where there are no processes
text: On a platform that cannot start a process, such as Python under Pyodide in
  a browser, the tool still reaches tl and tl-compose, and every output is produced
  exactly as it is from a terminal.
rationale: The editor runs Python in a Web Worker under Pyodide, which has no fork
  and no exec. A tool that can only spawn a command cannot run there at all.
normative: true
links:
- target: INT-0002
  type: derives_from
attrs:
  origin: ai
  verification: With the platform reported as emscripten, every format for the fixture
    is produced and matches the output produced through the command.
