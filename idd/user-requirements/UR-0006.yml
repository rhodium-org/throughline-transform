uid: UR-0006
type: user_requirement
status: ratified
title: The tool runs where there are no processes
text: On a platform that cannot start a process, such as Python under Pyodide in
  a browser, the tool still reaches tl, and every output is produced exactly as it
  is from a terminal.
rationale: The editor runs Python in a Web Worker under Pyodide, which has no fork
  and no exec. A tool that can only spawn a command cannot run there at all.
normative: true
