uid: UR-0005
type: user_requirement
status: ratified
title: A caller that knows the repository, ref and commit states them
text: A caller that holds the graph's repository, ref, commit and working-tree state
  — the editor has them from the clone, and has no git to ask — can state them, and
  the output carries what was stated. Git is not consulted when they are given.
rationale: Under Pyodide there is no git. Left to itself the tool would report a
  graph the editor cloned at a known commit as not under version control, which is
  the one thing SR-0066 in the editor's graph forbids an export to get wrong.
normative: true
links:
