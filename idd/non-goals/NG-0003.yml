uid: NG-0003
type: non_goal
status: ratified
title: No server and no user interface
text: This tool is a command run over a directory. It listens on nothing, serves
  nothing and opens no window.
rationale: The editor is the interactive surface for this family. A second one here
  would be a second implementation to keep in step.
normative: true
