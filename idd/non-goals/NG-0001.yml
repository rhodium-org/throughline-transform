uid: NG-0001
type: non_goal
status: ratified
title: No second renderer of an item's words
text: This tool never composes the prose of an item. Every word of an item in an
  output is written by tl docs. The tool adds containers, front matter and link syntax,
  and nothing else.
rationale: A second renderer drifts from what tl docs --check gates, and a document
  that quietly differs from the published specification is worse than none.
normative: true
